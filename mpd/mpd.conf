# ── mpd.conf — generado por install-eww-config.sh ──────────────────────────

music_directory     "/home/archlinux/musicas"
playlist_directory  "/home/archlinux/.local/share/mpd/playlists"
db_file             "/home/archlinux/.local/share/mpd/database"
log_file            "/home/archlinux/.local/share/mpd/log"
pid_file            "/home/archlinux/.local/share/mpd/pid"
state_file          "/home/archlinux/.local/share/mpd/state"


# Escuchar sólo localmente
bind_to_address     "127.0.0.1"
port                "6600"

# Salida de audio (PipeWire / PulseAudio)
audio_output {
    type    "pipewire"
    name    "PipeWire Output"
}

# Fallback PulseAudio
# audio_output {
#     type    "pulse"
#     name    "PulseAudio Output"
# }

auto_update         "yes"
