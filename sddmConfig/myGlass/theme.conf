[General]
font="Cantarell"
Padding="50"
CornerRadius="20"
GeneralFontSize="10"
LoginScale="0.175"
UserPictureBorderWidth="5"
UserPictureBorderColor="#e4e4e4"
UserPictureColor="#1e1d2f"
TextFieldColor="#1e1d2f"
TextFieldTextColor="#e4e4e4"
LoginButtonTextColor="#1e1d2f"
LoginButtonBgColor="#e4e4e4"
LoginButtonText="Ingresar"
PopupBgColor="#e4e4e4"
PopupHighlightColor="#1e1d2f"
SessionButtonColor="#e4e4e4"
SessionIconColor="#1e1d2f"
PowerButtonColor="#e4e4e4"
PowerIconColor="#1e1d2f"
DateColor="#e4e4e4"
DateSize="25"
DateIsBold="false"
DateOpacity="0.8"
DateFormat="dddd, MMMM d"
TimeColor="#e4e4e4"
TimeSize="60"
TimeIsBold="true"
TimeOpacity="0.8"
TimeFormat="hh:mm AP"

; --- CONFIGURACIÓN DE FONDO ---
; RandomBackground: si es "true", elige un fondo aleatorio de la carpeta backgrounds/
;                   si es "false", usa el archivo definido en Background
; Background: ruta al fondo específico (solo se usa si RandomBackground=false)
;             puede ser imagen (.png .jpg .jpeg .bmp .webp) o video (.mp4 .webm .mkv)
; Ejemplos:
;   Background="backgrounds/mi_fondo.jpg"
;   Background="backgrounds/mi_video.mp4"
RandomBackground="true"
Background="backgrounds/bg.png"

[Autologin]
Relogin=false
Session=
User=

[General]
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot

[Theme]
Current=Corners

[Users]
MaximumUid=60513
MinimumUid=1000
